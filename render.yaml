# Infraestructura de NimbusVault en Render (Blueprint).
# Render lee este archivo y crea la base de datos, la API y el frontend.
# Guía paso a paso: docs/despliegue.md
#
#   navegador ──https──> nimbusvault-web (nginx) ──/api──> nimbusvault-api (FastAPI) ──> PostgreSQL
#                                                                   └──> Supabase Storage (archivos)
#                                                                   └──> Brevo (correos)

databases:
  - name: nimbusvault-db
    plan: free            # 1 GB; vence 30 días después de crearse
    databaseName: nimbusvault
    user: nimbus

services:
  - type: web
    name: nimbusvault-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENTORNO
        value: produccion
      - key: DATABASE_URL
        fromDatabase:
          name: nimbusvault-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # URL pública del frontend: se usa en los enlaces de los correos
      - key: FRONTEND_URL
        value: https://nimbusvault-web.onrender.com
      - key: CORS_ORIGINS
        value: https://nimbusvault-web.onrender.com
      - key: EMAIL_BACKEND
        value: brevo
      # Valores secretos: Render los pide al crear el Blueprint (sync: false = no viven en el repo)
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_REMITENTE
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: nimbusvault
      - key: ADMIN_CORREO
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: nimbusvault-web
    runtime: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      # nginx reenvía /api a la API, así navegador, front y API comparten dominio
      - key: API_UPSTREAM
        value: https://nimbusvault-api.onrender.com
