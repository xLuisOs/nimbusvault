# Plantilla: la imagen de nginx reemplaza ${...} con variables de entorno al arrancar
# (las variables propias de nginx como $host no se tocan).
#   PORT          puerto donde escucha (80 en docker compose, Render pone 10000)
#   API_UPSTREAM  a dónde se reenvía /api (http://backend:8000 en local, la URL del backend en Render)
server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    # Resolver el nombre en cada petición y no solo al arrancar: en Render la IP del backend puede cambiar
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    set $api ${API_UPSTREAM};

    # Front y API en el mismo dominio: así la cookie de sesión (refresh token) funciona sin CORS
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        # En el plan gratis el backend se duerme y tarda ~1 min en despertar
        proxy_read_timeout 180s;
    }

    # React Router: cualquier ruta que no sea un archivo devuelve index.html
    location / {
        try_files $uri /index.html;
    }
}
