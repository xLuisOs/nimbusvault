# Corre en cada push y en cada Pull Request.
# Si algo falla aquí, GitHub no deja hacer merge (ver CONTRIBUTING.md).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  # Integración: las mismas pruebas, pero contra PostgreSQL real (el motor de producción)
  # y verificando que las migraciones de Alembic corran y coincidan con los modelos.
  backend-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nimbus
          POSTGRES_PASSWORD: nimbus
          POSTGRES_DB: nimbusvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nimbus -d nimbusvault"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://nimbus:nimbus@localhost:5432/nimbusvault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migraciones desde cero
        run: alembic upgrade head
      - name: Las migraciones coinciden con los modelos
        run: alembic check
      - name: Pruebas contra PostgreSQL
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://nimbus:nimbus@localhost:5432/nimbusvault

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
