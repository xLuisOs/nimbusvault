# Levanta todo NimbusVault en local:  docker compose up --build
#   App:        http://localhost:5173
#   API (docs): http://localhost:8000/api/docs
#   Correos:    http://localhost:8025   (Mailpit: aquí caen los correos de verificación)
#   Almacenamiento: http://localhost:9001 (MinIO Console)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbusvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbusvault"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # interfaz web
      - "1025:1025"   # SMTP

  minio:
    image: bitnami/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nimbus:nimbus@db:5432/nimbusvault
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-cambiar}
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-https://wcqdtudunvfmpemvyaym.supabase.co/storage/v1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-nimbusvault}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  minio_data: