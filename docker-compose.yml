# Levanta todo NimbusVault en local:  docker compose up --build
#   App:        http://localhost:5173
#   API (docs): http://localhost:8000/api/docs
#   Correos:    http://localhost:8025   (Mailpit: aquí caen los correos de verificación)
#   Almacenamiento de archivos (S3): se agrega en el Avance 2. Las imágenes de MinIO ya no están en Docker Hub.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbusvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbusvault"]
      interval: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # interfaz web
      - "1025:1025"   # SMTP

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nimbus:nimbus@db:5432/nimbusvault
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-cambiar}
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: